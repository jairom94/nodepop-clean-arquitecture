name: nodepop

services:
  app:
    container_name: nodepop-backend
    image: nodepop-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3005:3005"
    volumes:
      - .:/usr/src/app 
      - /usr/src/app/node_modules                 
    restart: always
    env_file:
      - .env