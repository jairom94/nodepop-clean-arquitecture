name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# Un despliegue a la vez; uno nuevo cancela al que siga en curso
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jairom94/nodepop-backend

jobs:
  build:
    name: Construir y publicar la imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # subir la imagen a GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest es la que despliega el servidor; la etiqueta con el commit permite volver atrás
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el servidor
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # el servidor descarga la imagen con este token
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend/docker/compose.yml
          sparse-checkout-cone-mode: false

      # Sin rm: en esa carpeta también vive backend.env, que solo existe en el servidor
      - name: Copiar compose.yml a /home/jairo/nodepop
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          source: backend/docker/compose.yml
          target: /home/jairo/nodepop
          # backend/docker/compose.yml -> compose.yml
          strip_components: 2

      - name: Descargar la imagen y reiniciar el contenedor
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /home/jairo/nodepop
            # El token caduca al acabar el job; aun así no se deja guardado en el servidor
            trap 'docker logout ghcr.io' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            # --wait espera al healthcheck de /health: si el backend no arranca, el job falla
            docker compose up -d --wait --wait-timeout 60
            # Borra las imágenes antiguas que ya no usa ningún contenedor
            docker image prune -f
